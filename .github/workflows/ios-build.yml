name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - ipa-build-temp

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Install CocoaPods (clean cache)
        run: |
          cd ios
          rm -f Podfile.lock
          pod deintegrate || true
          pod repo update
          pod install

      - name: Clear iOS build cache
        run: |
          rm -rf build/ios
          rm -rf ~/Library/Developer/Xcode/DerivedData/*Runner*

      - name: Build iOS (no codesign)
        run: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Create IPA manually
        run: |
          mkdir Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Runner.ipa
