name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - ipa-build-temp

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Install CocoaPods (clean cache)
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          rm -rf Flutter/Flutter.podspec Flutter/Flutter.framework
          pod deintegrate || true
          pod repo update
          pod install

      - name: Clear iOS build cache
        run: |
          rm -rf build/
          rm -rf ~/Library/Developer/Xcode/DerivedData/
          rm -rf ios/Flutter/Flutter.podspec
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/.symlinks/

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Create IPA manually
        run: |
          mkdir Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Runner.ipa
