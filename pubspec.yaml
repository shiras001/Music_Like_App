name: music_like
description: MUSIC LIKE - Apple Music ライク音楽ストリーミングアプリ
publish_to: 'none'

version: 0.0.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0
  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.14.0
  
  # ファイル選択ダイアログ
  file_picker: ^8.0.0
  
  # ストレージパス取得
  path_provider: ^2.1.0
  
  # YouTube音声取得（リリース版では削除）
  # youtube_explode_dart: ^3.0.5
  
  # パス操作
  path: ^1.8.0
  
  # HTTP通信（YouTube動画情報取得用）
  http: ^1.1.0
  
  # シンプルなオーディオ再生
  just_audio: ^0.9.33
  
  # 通知・ロック画面制御
  audio_service: ^0.18.0

  # Android 13+ 通知権限リクエスト
  permission_handler: ^11.3.1
  
  # 設定の永続化
  shared_preferences: ^2.2.0

  # ローカルライブラリDB
  sqflite: ^2.3.0

  # サムネイル生成
  image: ^4.1.3

  # 画像トリミング
  image_cropper: ^11.0.0

  # カラーピッカー
  flutter_colorpicker: ^1.1.0

  # 広告表示
  google_mobile_ads: ^5.3.1

  # アプリ内課金（定期購読）
  in_app_purchase: ^3.2.0

  # 外部URL起動（定期購読管理ページ）
  url_launcher: ^6.3.0

  # ファイルパスの安定ハッシュ
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - icon_2melody.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon_2melody.png"
  min_sdk_android: 21
